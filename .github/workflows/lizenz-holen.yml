# Einmalig (Ticket #47): holt den offiziellen Text der Functional Source License (FSL-1.1-ALv2) von fsl.software,
# trägt Jahr und Lizenzgeber ein und schreibt ihn als LICENSE auf den Zweig, weil die Cloud-Sitzung die Adresse nicht
# erreicht. Wird danach entfernt.
name: Lizenz holen

on:
  push:
    branches: [claude/gracious-ramanujan-n8jsof]
    paths: ['.github/workflows/lizenz-holen.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Text holen und prüfen
        run: |
          curl -fsSL https://fsl.software/FSL-1.1-ALv2.template.md -o "$RUNNER_TEMP/fsl.md" \
            || curl -fsSL https://raw.githubusercontent.com/getsentry/fsl.software/main/FSL-1.1-ALv2.template.md -o "$RUNNER_TEMP/fsl.md"
          if grep -qi '<html' "$RUNNER_TEMP/fsl.md"; then echo "Die Antwort ist HTML, kein Lizenztext"; exit 1; fi
          sha256sum "$RUNNER_TEMP/fsl.md"
          wc -l "$RUNNER_TEMP/fsl.md"
          echo "--- Anfang ---"; head -20 "$RUNNER_TEMP/fsl.md"
          echo "--- Platzhalter ---"; grep -n '\${' "$RUNNER_TEMP/fsl.md" || echo "(keine)"
          grep -qi 'functional source license' "$RUNNER_TEMP/fsl.md"
          grep -q 'FSL-1.1-ALv2' "$RUNNER_TEMP/fsl.md"
      - name: Eintragen
        run: |
          sed -e 's/\${year}/2026/g' -e 's/\${licensor name}/goerks (https:\/\/github.com\/goerks)/g' "$RUNNER_TEMP/fsl.md" > LICENSE
          if grep -q '\${' LICENSE; then echo "Platzhalter übrig:"; grep -n '\${' LICENSE; exit 1; fi
          wc -l LICENSE; head -12 LICENSE
      - name: Lizenzdatei von khroma ansehen (kein Lizenzfeld im Paket)
        run: |
          npm ci --ignore-scripts --cache "$RUNNER_TEMP/npm" --no-audit --no-fund >/dev/null
          ls node_modules/khroma
          cat node_modules/khroma/license* node_modules/khroma/LICENSE* 2>/dev/null | head -8 || true
          grep -n 'repository\|license' node_modules/khroma/package.json || true
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop-go/go.mod
      - name: Go-Teil, jsmin von Crockford und woher es kommt
        working-directory: desktop-go
        run: |
          go mod download
          d=$(go list -m -f '{{.Dir}}' github.com/dchest/jsmin)
          echo "== Lizenz"; cat "$d"/LICENSE* "$d"/license* 2>/dev/null | head -40
          echo "== go mod why"; go mod why -m github.com/dchest/jsmin github.com/josephspurrier/goversioninfo github.com/akavel/rsrc || true
          for os in linux windows darwin; do echo "== im Programm fuer $os (Anzahl Treffer)"; GOOS=$os GOARCH=amd64 go list -deps ./... | grep -c 'dchest/jsmin' || true; done
          echo "== wer importiert jsmin im Quelltext von zenity"; grep -rn 'dchest/jsmin' "$(go list -m -f '{{.Dir}}' github.com/ncruces/zenity)" --include=*.go | head
      - name: Zurückschreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE
          git commit -m "Lizenz: Text der FSL-1.1-ALv2 von fsl.software (#47)" || echo "keine Änderung"
          git push origin HEAD:claude/gracious-ramanujan-n8jsof
