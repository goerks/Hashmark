# Einmalig (Ticket #56/#57): installiert markmap-view und markmap-common und schreibt package.json und
# package-lock.json auf den Zweig zurück, weil die Cloud-Sitzung die Registry nicht erreicht. Wird danach entfernt.
name: Abhängigkeit installieren

on:
  push:
    branches: [claude/gracious-ramanujan-n8jsof]
    paths: ['.github/workflows/abhaengigkeit-installieren.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --save-exact --ignore-scripts --cache "$RUNNER_TEMP/npm" --no-audit --no-fund markmap-view@0.18.12 markmap-common@0.18.9
      - run: git diff --stat -- package.json package-lock.json
      - name: Zurückschreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: markmap-view und markmap-common als Abhängigkeiten (#56)" || echo "keine Änderung"
          git push origin HEAD:claude/gracious-ramanujan-n8jsof
