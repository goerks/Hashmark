# Einmalige Prüfung der Abhängigkeiten (Tickets #47 Lizenz, #56/#57 Plugins, Markmap). Läuft in GitHub Actions,
# nicht in der Cloud-Sitzung. Wird nach der Auswertung wieder entfernt.
name: Abhängigkeitsprüfung

on:
  push:
    branches: [claude/gracious-ramanujan-n8jsof]
    paths: ['.github/workflows/abhaengigkeitspruefung.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop-go/go.mod

      - name: Prüfskript schreiben
        run: |
          cat > "$RUNNER_TEMP/audit.mjs" <<'EOF'
          // Liest alle Pakete in node_modules: Lizenz, Installationsskripte, Programme (bin), Plattform, native Dateien.
          import { readdirSync, readFileSync, statSync, existsSync } from 'node:fs'
          import { join } from 'node:path'
          import { execSync } from 'node:child_process'

          const [root, onlyProd] = [process.argv[2], process.argv[3] === 'prod']
          const nm = join(root, 'node_modules')
          const NATIVE = /\.(node|exe|dll|so|dylib|wasm|jar)$/i
          let prod = null
          if (onlyProd) {
            prod = new Set(execSync('npm ls --omit=dev --all --parseable', { cwd: root, encoding: 'utf8', maxBuffer: 1 << 26 }).split('\n').filter(Boolean))
          }
          const rows = []
          function nativeFiles(dir, depth = 0, out = []) {
            if (depth > 4) return out
            for (const e of readdirSync(dir, { withFileTypes: true })) {
              if (e.name === 'node_modules') continue
              const p = join(dir, e.name)
              if (e.isDirectory()) nativeFiles(p, depth + 1, out)
              else if (NATIVE.test(e.name)) out.push(e.name)
            }
            return out
          }
          function walk(dir) {
            for (const name of readdirSync(dir)) {
              if (name.startsWith('.')) continue
              const p = join(dir, name)
              if (!statSync(p).isDirectory()) continue
              if (name.startsWith('@')) { walk(p); continue }
              const pj = join(p, 'package.json')
              if (existsSync(pj)) {
                if (prod && !prod.has(p)) { if (existsSync(join(p, 'node_modules'))) walk(join(p, 'node_modules')); continue }
                const d = JSON.parse(readFileSync(pj, 'utf8'))
                const s = d.scripts || {}
                const lic = typeof d.license === 'string' ? d.license : d.license?.type ?? (d.licenses ? JSON.stringify(d.licenses) : '?')
                rows.push({
                  name: d.name, version: d.version, lic,
                  inst: ['preinstall', 'install', 'postinstall'].filter((k) => s[k]).join('+') || '-',
                  bin: d.bin ? Object.keys(typeof d.bin === 'string' ? { [d.name]: 1 } : d.bin).join(',') : '-',
                  plat: [d.os && 'os=' + d.os, d.cpu && 'cpu=' + d.cpu].filter(Boolean).join(' ') || '-',
                  nat: [...new Set(nativeFiles(p))].join(',') || '-',
                })
              }
              if (existsSync(join(p, 'node_modules'))) walk(join(p, 'node_modules'))
            }
          }
          walk(nm)
          rows.sort((a, b) => a.name.localeCompare(b.name))
          console.log(`Pakete: ${rows.length}`)
          const byLic = {}
          for (const r of rows) byLic[r.lic] = (byLic[r.lic] || 0) + 1
          console.log('Lizenzen:', JSON.stringify(byLic))
          console.log('--- mit Installationsskript, Programm, Plattform oder nativen Dateien ---')
          for (const r of rows.filter((r) => r.inst !== '-' || r.plat !== '-' || r.nat !== '-' || r.bin !== '-'))
            console.log(`${r.name}@${r.version}  lic=${r.lic}  install=${r.inst}  bin=${r.bin}  plat=${r.plat}  native=${r.nat}`)
          console.log('--- alle Pakete ---')
          for (const r of rows) console.log(`${r.name}@${r.version}  ${r.lic}`)
          EOF

      - name: Markmap (nur die drei Pakete, ohne Skripte installiert)
        run: |
          mkdir "$RUNNER_TEMP/mm" && cd "$RUNNER_TEMP/mm"
          npm init -y >/dev/null
          echo "::group::npm view"
          for p in markmap-lib markmap-view markmap-common; do
            echo "== $p"
            npm view "$p" version license dist.unpackedSize dependencies peerDependencies bin os cpu scripts.install scripts.postinstall
          done
          echo "::endgroup::"
          npm install markmap-lib markmap-view markmap-common --ignore-scripts --no-audit --no-fund
          echo "== Baum"
          npm ls --all
          echo "== Größe"
          du -sh node_modules
          node "$RUNNER_TEMP/audit.mjs" "$PWD"

      - name: Bestehende Laufzeit-Abhängigkeiten des Projekts (für die Lizenz, ohne Skripte installiert)
        run: |
          npm ci --ignore-scripts --cache "$RUNNER_TEMP/npm" --no-audit --no-fund
          node "$RUNNER_TEMP/audit.mjs" "$PWD" prod

      - name: Go-Abhängigkeiten der Desktop-Hülle
        working-directory: desktop-go
        run: |
          go mod download
          go list -m -f '{{.Path}} {{.Version}} {{.Dir}}' all | tail -n +2 | while read -r path ver dir; do
            echo "== $path $ver"
            for f in "$dir"/LICENSE* "$dir"/COPYING* "$dir"/license*; do
              [ -f "$f" ] && { head -n 3 "$f"; break; }
            done
          done
