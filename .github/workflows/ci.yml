# CI: bei jedem Push und Pull Request testen, die Desktop-Hülle für alle Ziele bauen und das Docker-Image prüfen.
# Pakete und Release: release.yml (bei einem Tag), Dokumentation: pages.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Pakete online aus dem Lockfile; der Cache in vendor/ enthält nur die Windows-Binärdateien
      - run: npm ci --cache "$RUNNER_TEMP/npm" --no-audit --no-fund
      - run: npx vitest run

  # Präsentation im echten Browser (Chrome des Runners): Video (Start per Schritt, K, Überspringen, Ausschnitt, Teilabrufe) und Bild-Zoom
  browser-e2e:
    runs-on: ubuntu-latest
    env:
      HASHMARK_BROWSER: /usr/bin/google-chrome
      HASHMARK_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --cache "$RUNNER_TEMP/npm" --no-audit --no-fund
      - run: node scripts/video-e2e.ts
      - run: node scripts/zoom-e2e.ts

  # Go-Hülle ohne CGO: der Go-Compiler genügt, auch für die anderen Plattformen
  build-app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [windows-amd64, windows-arm64, linux-amd64, linux-arm64, darwin-amd64, darwin-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: desktop-go/go.sum
      - name: Bauen
        env:
          CGO_ENABLED: '0'
        run: |
          TARGET=${{ matrix.target }}
          export GOOS="${TARGET%-*}" GOARCH="${TARGET#*-}"
          cd desktop-go && go vet . && go build -trimpath -ldflags="-s -w" -o /dev/null .

  # Zum Ausprobieren ohne Git: bei jedem Pull Request ein Windows-Paket (entpacken, Hashmark.exe starten) und die
  # HTML-Datei des Beispiel-Decks samt Videoordner als Download (Actions › Lauf › Artifacts, 7 Tage)
  probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: desktop-go/go.sum
      - name: Version
        run: echo "VERSION=pr${{ github.event.number }}.$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Hülle bauen
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: cd desktop-go && go build -trimpath -ldflags="-s -w -X main.version=$VERSION -H windowsgui" -o ../dist-go/hashmark-windows-amd64.exe .
      - run: npm ci --cache "$RUNNER_TEMP/npm" --no-audit --no-fund
      - name: Paket bauen
        run: node scripts/package-app.ts windows-amd64 --version="$VERSION" --archive --online
      - name: HTML-Datei des Beispiel-Decks
        run: node src/cli/index.ts export examples/hashmark-demo --out export/hashmark-demo.html
      - uses: actions/upload-artifact@v4
        with:
          name: probe-windows
          path: dist-app/hashmark-*
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: probe-html-demo
          path: export/
          retention-days: 7
          if-no-files-found: error

  # Webseite wie auf GitHub Pages, mit Bildern aus der App: prüft den Bau und liegt bei Pull Requests als Download
  # bereit (probe-webseite: entpacken, „Webseite ansehen.cmd“ doppelklicken; die Iframes mit echten Folien brauchen einen Server)
  docs:
    runs-on: ubuntu-latest
    env:
      HASHMARK_BROWSER: /usr/bin/google-chrome
      HASHMARK_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tags für den neuesten Release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --cache "$RUNNER_TEMP/npm" --no-audit --no-fund
      - name: Bilder aufnehmen
        run: node scripts/make-screenshots.ts --out "$RUNNER_TEMP/shots"
      - name: Dokumentation bauen
        env:
          HASHMARK_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
          HASHMARK_SHOTS: ${{ runner.temp }}/shots
        run: node scripts/build-docs.ts --out public
      - name: Starter zum Ansehen unter Windows
        if: github.event_name == 'pull_request'
        run: cp scripts/webseite-ansehen.ps1 public/ && cp scripts/webseite-ansehen.cmd "public/Webseite ansehen.cmd"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: probe-webseite
          path: public/
          retention-days: 7
          if-no-files-found: error

  # Image bauen, aber nicht veröffentlichen (das macht docker.yml auf main)
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
