# GitLab CI: testen, Desktop-App für alle Plattformen bauen und packen, bei einem Tag ein Release veröffentlichen,
# Docker-Image bauen und auf Render ausrollen.
#
# Bei jedem Push (Branch oder Tag):
#   version      Version <letzter Tag ohne v>.<Kurz-Hash>, z. B. 1.2.0.a1b2c3d (ohne Tag 0.0.0.<hash>) → Variable VERSION
#   test         Vitest
#   build-app    Go-Hülle ohne CGO für 6 Ziele (windows/linux/darwin × amd64/arm64), Version per ldflags eingebettet
#   package      Standalone-Pakete (Hülle + Node + App, keine Installer): dist-app/hashmark-<version>-<ziel>.zip|.tar.gz
# Bei einem Tag zusätzlich:
#   release-notes  Funktionen und Fehlerbehebungen aus den Commit-Betreffzeilen seit dem vorherigen Tag
#   publish        Pakete in die Generic Package Registry des Projekts
#   release        GitLab-Release mit Notizen und Download-Links
#
# Einmalig einzurichten (siehe README, Abschnitt „Deployment“):
#   CI/CD-Variable RENDER_DEPLOY_HOOK_URL  (maskiert, geschützt)  Deploy-Hook-URL des Render-Dienstes
# Die Registry-Anmeldung (CI_REGISTRY_*) und CI_JOB_TOKEN stellt GitLab selbst bereit.

stages: [.pre, test, build, package, publish, release, deploy]

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# Version aus dem letzten Tag und dem Commit-Hash; alle späteren Jobs erhalten VERSION über `needs`
version:
  stage: .pre
  image: golang:1.26-bookworm
  variables:
    GIT_DEPTH: "0" # volle Historie samt Tags, sonst findet git describe keinen Tag
  script:
    - TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0)
    - VERSION="${TAG#v}.$(git rev-parse --short HEAD)"
    - echo "Version $VERSION"
    - echo "VERSION=$VERSION" > version.env
  artifacts:
    reports:
      dotenv: version.env

test:
  stage: test
  image: node:24-bookworm-slim
  needs: []
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npx vitest run

# Go-Hülle für alle Ziele. Ohne CGO, deshalb reicht der Go-Compiler (kein C-Compiler, kein Cross-Toolchain).
build-app:
  stage: build
  image: golang:1.26-bookworm
  needs: [version]
  parallel:
    matrix:
      - TARGET: [windows-amd64, windows-arm64, linux-amd64, linux-arm64, darwin-amd64, darwin-arm64]
  variables:
    CGO_ENABLED: "0"
    GOMODCACHE: $CI_PROJECT_DIR/.go/mod
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths: [.go/mod/]
  script:
    - export GOOS="${TARGET%-*}" GOARCH="${TARGET#*-}"
    - LDFLAGS="-s -w -X main.version=$VERSION"
    - EXT=""
    - if [ "$GOOS" = windows ]; then LDFLAGS="$LDFLAGS -H windowsgui"; EXT=".exe"; fi
    - cd desktop-go && go vet . && go build -trimpath -ldflags="$LDFLAGS" -o "../dist-go/hashmark-$TARGET$EXT" .
  artifacts:
    paths: [dist-go/]
    expire_in: 1 week

# Standalone-Paket je Ziel: Hülle + Node (von nodejs.org, SHA256 geprüft) + App mit den Laufzeit-Paketen des Ziels
package:
  stage: package
  image: node:24-bookworm
  needs: [version, build-app]
  parallel:
    matrix:
      - TARGET: [windows-amd64, windows-arm64, linux-amd64, linux-arm64, darwin-amd64, darwin-arm64]
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - apt-get update -qq && apt-get install -y -qq zip
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - node scripts/package-app.ts "$TARGET" --version="$VERSION" --archive --online
  artifacts:
    paths: [dist-app/hashmark-*]
    expire_in: 1 month

release-notes:
  stage: build
  image: node:24-bookworm
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    GIT_DEPTH: "0"
  script:
    - node scripts/release-notes.ts "$CI_COMMIT_TAG" > release-notes.md
    - cat release-notes.md
  artifacts:
    paths: [release-notes.md]

# Pakete in die Generic Package Registry: <projekt>/-/packages, Version = VERSION
publish:
  stage: publish
  image: curlimages/curl:8.11.1
  needs: [version, package]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      for file in dist-app/hashmark-*; do
        echo "Lade $file hoch"
        # Antwort von GitLab zeigen: ein 403 hat dort die Ursache (Registry abgeschaltet, fehlende Rechte …)
        code=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/hashmark/$VERSION/$(basename "$file")")
        if [ "$code" != "201" ] && [ "$code" != "200" ]; then
          echo "Upload fehlgeschlagen: HTTP $code"
          cat response.txt
          exit 1
        fi
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [version, release-notes, publish]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Release $CI_COMMIT_TAG ($VERSION)"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Hashmark $CI_COMMIT_TAG
    description: ./release-notes.md
    assets:
      links:
        - name: Windows x64 (.zip)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/hashmark/$VERSION/hashmark-$VERSION-windows-amd64.zip
          link_type: package
        - name: Windows ARM64 (.zip)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/hashmark/$VERSION/hashmark-$VERSION-windows-arm64.zip
          link_type: package
        - name: Linux x64 (.tar.gz)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/hashmark/$VERSION/hashmark-$VERSION-linux-amd64.tar.gz
          link_type: package
        - name: Linux ARM64 (.tar.gz)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/hashmark/$VERSION/hashmark-$VERSION-linux-arm64.tar.gz
          link_type: package
        - name: macOS Intel (.tar.gz)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/hashmark/$VERSION/hashmark-$VERSION-darwin-amd64.tar.gz
          link_type: package
        - name: macOS Apple Silicon (.tar.gz)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/hashmark/$VERSION/hashmark-$VERSION-darwin-arm64.tar.gz
          link_type: package

# Image mit Kaniko bauen (kein Docker-in-Docker nötig). Außerhalb des Standard-Branches nur bauen, nicht veröffentlichen.
# Der Job darf nicht „image“ heißen: das ist in GitLab CI ein reserviertes Schlüsselwort.
build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" > /kaniko/.docker/config.json
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        DESTINATIONS="--destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA --destination $CI_REGISTRY_IMAGE:latest"
      else
        DESTINATIONS="--no-push"
      fi
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" $DESTINATIONS

# Render zieht das neue Image (Tag = Commit) über den Deploy-Hook. Nur auf dem Standard-Branch.
deploy:
  stage: deploy
  image: curlimages/curl:8.11.1
  needs: [build-image]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RENDER_DEPLOY_HOOK_URL
  environment:
    name: render
  script:
    # imgURL: alles außer dem Tag muss zur Image-Adresse im Render-Dienst passen (docker://-Präfix entfällt)
    - |
      IMG=$(printf '%s' "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" | sed 's|/|%2F|g; s|:|%3A|g')
      curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL&imgURL=$IMG"
