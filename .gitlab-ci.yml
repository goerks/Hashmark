# GitLab CI: testen, Docker-Image bauen und in die Registry legen, auf Render ausrollen.
#
# Einmalig einzurichten (siehe README, Abschnitt „Deployment“):
#   CI/CD-Variable RENDER_DEPLOY_HOOK_URL  (maskiert, geschützt)  Deploy-Hook-URL des Render-Dienstes
# Die Registry-Anmeldung (CI_REGISTRY_*) stellt GitLab selbst bereit.

stages: [test, build, deploy]

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:
  stage: test
  image: node:24-bookworm-slim
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npx vitest run

# Image mit Kaniko bauen (kein Docker-in-Docker nötig). Auf Merge Requests nur bauen, nicht veröffentlichen.
# Der Job darf nicht „image“ heißen: das ist in GitLab CI ein reserviertes Schlüsselwort.
build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" > /kaniko/.docker/config.json
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        DESTINATIONS="--destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA --destination $CI_REGISTRY_IMAGE:latest"
      else
        DESTINATIONS="--no-push"
      fi
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" $DESTINATIONS

# Render zieht das neue Image (Tag = Commit) über den Deploy-Hook. Nur auf dem Standard-Branch.
deploy:
  stage: deploy
  image: curlimages/curl:8.11.1
  needs: [build-image]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RENDER_DEPLOY_HOOK_URL
  environment:
    name: render
  script:
    # imgURL: alles außer dem Tag muss zur Image-Adresse im Render-Dienst passen (docker://-Präfix entfällt)
    - |
      IMG=$(printf '%s' "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" | sed 's|/|%2F|g; s|:|%3A|g')
      curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL&imgURL=$IMG"
