# Render-Blueprint: ein Webdienst aus dem Image der GitLab-Registry.
# Präsentation unter /, Editor unter /editor.html (Passwort). Neue Images rollt die GitLab-Pipeline über den Deploy-Hook aus.
#
# Vor dem ersten Start anpassen:
#   - image.url: Adresse des Images, z. B. registry.gitlab.com/<gruppe>/<projekt>:latest
#   - in Render unter Workspace Settings → Registry Credentials die Zugangsdaten „gitlab“ anlegen
#     (Registry registry.gitlab.com, Benutzername und Token eines GitLab-Deploy-Tokens mit read_registry)
services:
  - type: web
    name: hashmark
    runtime: image
    image:
      url: registry.gitlab.com/goerks/hashmark:latest
      creds:
        fromRegistryCreds:
          name: gitlab
    plan: starter            # Festplatten gibt es erst ab „Starter“; ohne Festplatte gehen Änderungen aus dem Editor beim Neustart verloren
    autoDeploy: false        # ausgerollt wird über den Deploy-Hook der GitLab-Pipeline
    healthCheckPath: /healthz
    disk:
      name: hashmark-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: EDITOR_PASSWORD
        sync: false          # in Render eintragen, steht nicht im Repo
      - key: EDITOR_USER
        value: editor
