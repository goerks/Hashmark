<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Strata</title>
    <link rel="stylesheet" href="./start.css" />
  </head>
  <body>
    <main class="start">
      <header>
        <h1>Strata</h1>
        <p>Präsentationen aus Markdown – als navigierbarer Baum.</p>
      </header>

      <section class="actions">
        <button id="open" class="primary">Deck öffnen …<kbd>Ctrl+O</kbd></button>
        <button id="create">Neues Deck …<kbd>Ctrl+N</kbd></button>
        <button id="example">Beispiel-Deck</button>
      </section>

      <p class="status" id="status" hidden></p>

      <section class="recent">
        <h2>Zuletzt geöffnet</h2>
        <ul id="recent"></ul>
        <p class="empty" id="empty" hidden>Noch keine Decks geöffnet.</p>
      </section>

      <p class="hint">Ein Deck ist ein Ordner mit <code>deck.yaml</code> oder <code>.md</code>-Dateien.</p>
    </main>
    <script src="./start.js"></script>
  </body>
</html>
