[package]
name = "strata"
version = "0.1.0"
edition = "2024"
description = "Strata – Markdown-Präsentationen als navigierbarer Baum (Desktop)"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.0", features = ["devtools"] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-opener = "2.7.0"

[build-dependencies]
tauri-build = "2.7.0"

[features]
# ohne dieses Feature erwartet Tauri einen Dev-Server (devUrl); die Startseite kommt aus frontendDist
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
